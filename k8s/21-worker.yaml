apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
  namespace: ticketing
spec:
  replicas: 1
  selector:
    matchLabels:
      app: worker
  template:
    metadata:
      labels:
        app: worker
    spec:
      serviceAccountName: ticketing-sa
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: worker
          image: ticketing-worker:v1
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef: { name: app-config }
          env:
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef: { name: app-secret, key: POSTGRES_PASSWORD }
          # Worker nema HTTP sucelje, pa nema ni readiness probe: nije iza
          # Servicea i nitko mu ne salje promet. Liveness se provjerava
          # postojanjem procesa - ako umre, Kubernetes ga restarta.
          livenessProbe:
            exec:
              command: ["sh", "-c", "pgrep -f worker.js > /dev/null"]
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests: { cpu: "50m",  memory: "128Mi" }
            limits:   { cpu: "300m", memory: "256Mi" }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
